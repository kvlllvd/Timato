# Метки по ответам формы отзыва.
#
# Смысл — не украсить issue, а получить гистограмму: сколько отзывов пришло
# про окно, сколько про звонок, сколько про установку. Ответ на «на что чаще
# всего обращают внимание» тогда считается одной командой с десктопа:
#
#     gh issue list --repo kvlllvd/Timato --label area:window --state all
#
# Метка ставится по выбору из выпадающего списка, а не по словам в тексте:
# текст люди пишут как хотят, а список один для всех — только так кучки
# сходятся.
name: Метки по форме отзыва

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const AREA = {
              'Окно и перенос':             'area:window',
              'Отсчёт, отдых и звонок':     'area:timer',
              'Тема оформления':            'area:theme',
              'Засечки и Summary':          'area:progress',
              'Adaptive и размер окна':     'area:adaptive',
              'Установка и первый запуск':  'area:install',
              'Другое':                     'area:other',
            }
            const TYPE = {
              'Что-то не работает': 'type:bug',
              'Не хватает':         'type:idea',
              'Непонятно':          'type:question',
            }

            // Issue-форма кладёт ответы в тело как «### Заголовок» и следом
            // строку значения. Незаполненное поле приходит как «_No response_».
            const body = context.payload.issue.body || ''
            const answer = (heading) => {
              const lines = body.split('\n')
              const at = lines.findIndex(l => l.trim() === '### ' + heading)
              if (at < 0) return null
              for (const line of lines.slice(at + 1)) {
                const value = line.trim()
                if (value.startsWith('###')) return null
                if (value && value !== '_No response_') return value
              }
              return null
            }

            const wanted = [AREA[answer('О какой части')], TYPE[answer('Что за отзыв')]]
                             .filter(Boolean)
            if (wanted.length === 0) return

            const issue = { owner: context.repo.owner, repo: context.repo.repo,
                            issue_number: context.payload.issue.number }

            // При правке issue выбор мог поменяться. Старые area:/type: снимаем,
            // иначе один отзыв попадёт в две кучки сразу и гистограмма соврёт.
            const now = context.payload.issue.labels.map(l => l.name)
            for (const stale of now) {
              if (/^(area|type):/.test(stale) && !wanted.includes(stale)) {
                await github.rest.issues.removeLabel({ ...issue, name: stale })
              }
            }

            const add = wanted.filter(l => !now.includes(l))
            if (add.length) await github.rest.issues.addLabels({ ...issue, labels: add })
